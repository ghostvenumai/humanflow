[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humanflow"
version = "0.1.0"
description = "Evidence-driven German realtime conversation engine"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
demo = ["anthropic>=0.84,<1", "fastapi>=0.115", "uvicorn>=0.30"]
eval = ["PyYAML>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
